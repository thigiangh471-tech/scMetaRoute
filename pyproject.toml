[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scmetaroute"
version = "0.1.0"
description = "Hierarchical metacell construction for single-cell RNA-seq"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.11",
    "h5py>=3.9",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
paper = ["statsmodels>=0.14"]

[project.scripts]
scmetaroute = "scmetaroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
